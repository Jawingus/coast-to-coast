# Rebuilds the game from the latest NHL stats once a week and publishes it.
# To run it by hand: the repo's Actions tab, "Weekly stats refresh", "Run workflow".
name: Weekly stats refresh
on:
  schedule:
    - cron: "30 8 * * 1"   # Mondays, 4:30 am Eastern (3:30 in winter)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the stats and rebuild
        run: bash build/refresh.sh
      - name: Publish if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build/splits.txt
          if git diff --cached --quiet; then
            echo "Nothing changed this week."
          else
            git commit -m "Weekly stats refresh"
            git push
          fi
