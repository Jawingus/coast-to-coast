# Rebuilds the game from the latest NHL stats once a week and publishes it.
# To run it by hand: the repo's Actions tab, "Weekly stats refresh", "Run workflow".
name: Weekly stats refresh
on:
  schedule:
    - cron: "30 8 * * 1"   # Mondays, 4:30 am Eastern (3:30 in winter)
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the stats and rebuild
        run: bash build/refresh.sh
      - name: Save the new version
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html build/splits.txt
          if git diff --cached --quiet; then
            echo "Nothing changed this week."
          else
            git commit -m "Weekly stats refresh"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # A commit made by this job does not make GitHub Pages republish on its own, so ask for it.
      - name: Publish the site
        if: steps.save.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
