<style>
/* Layout: the rink is the whole screen. It stands on end on tall screens so the puck travels up ice,
   and lies flat on wide ones. The prompt, clock and result float over the ice as glass panels. */
:root{
  color-scheme:dark;
  --bg:#05080D; --glass:rgba(6,11,17,.8); --edge:#27394A; --text:#EAF2F8; --dim:#8E9EAD; --faint:#55667A;
  --cyan:#7BD3FF; --blue:#4A86F0; --red:#FF3D55; --gold:#FFC857;
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{margin:0;color:var(--text);font:400 16px/1.5 var(--body)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
:is(button,input):focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:4px}

.app{position:relative;height:100%;min-height:540px;overflow:hidden;--top:74px}
#rink{position:absolute;inset:0;width:100%;height:100%;display:block}
.app.shake #rink{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{10%,90%{translate:-2px 0}20%,80%{translate:4px 0}30%,50%,70%{translate:-7px 0}40%,60%{translate:7px 0}}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;--c:255,61,85;background:radial-gradient(60% 45% at var(--fx,50%) var(--fy,10%),rgba(var(--c),.55),transparent 70%)}
.flash.gold{--c:255,200,87}
.flash.go{animation:flash 1.5s ease-out}
@keyframes flash{0%{opacity:0}8%{opacity:1}30%{opacity:.35}45%{opacity:.9}100%{opacity:0}}

.top{position:absolute;inset:0 0 auto 0;z-index:5;padding:12px 16px 14px;background:linear-gradient(var(--bg) 50%,rgba(5,8,13,0))}
.topin{max-width:900px;margin-inline:auto;display:flex;flex-direction:column;gap:9px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar > *{min-width:0}
.brand{font:italic 800 1.3rem/1 var(--display);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:9px;white-space:nowrap}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--text);box-shadow:0 0 14px 2px rgba(123,211,255,.7);display:inline-block;flex:none}
.tot{font:italic 800 1.75rem/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.tot small{font-size:.5em;color:var(--dim);font-weight:700;margin-left:5px;letter-spacing:.08em}
.pips{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex:1;max-width:240px}
.pips li{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12);transition:background .5s,box-shadow .5s}
.pips li.now{background:rgba(255,255,255,.4)}
.pips li.t1{background:var(--faint)} .pips li.t2{background:var(--blue)} .pips li.t3{background:var(--cyan)}
.pips li.t4{background:var(--text)} .pips li.t5{background:var(--red);box-shadow:0 0 10px rgba(255,61,85,.8)}
.pips li.t6{background:var(--gold);box-shadow:0 0 10px rgba(255,200,87,.8)} .pips li.t0{background:#2A3440}
.modes{display:flex;gap:3px;background:rgba(255,255,255,.07);padding:3px;border-radius:999px;flex:none}
.modes button{white-space:nowrap;font-weight:600;font-size:.78rem;padding:5px 10px;border-radius:999px;color:var(--dim);transition:background .25s,color .25s}
.modes button.on{background:var(--text);color:var(--bg)}

.readout{position:absolute;left:0;top:0;z-index:3;pointer-events:none;display:flex;flex-direction:column;gap:2px;--tc:var(--text);will-change:transform;text-shadow:0 2px 18px rgba(0,0,0,.75)}
.readout .line{font:italic 800 clamp(3rem,13vw,5.2rem)/.8 var(--display);font-variant-numeric:tabular-nums;color:var(--tc);display:flex;align-items:baseline;gap:6px;white-space:nowrap}
.readout .u{font-size:.28em;color:var(--dim);letter-spacing:.06em;font-weight:700}
.readout .z{font:italic 700 .95rem/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--tc);white-space:nowrap;opacity:.9}
.t1{--tc:var(--dim)} .t2{--tc:var(--blue)} .t3{--tc:var(--cyan)} .t4{--tc:var(--text)} .t5{--tc:var(--red)} .t6{--tc:var(--gold)} .t0{--tc:var(--faint)}

.card{position:absolute;left:50%;translate:-50% 0;z-index:4;width:min(calc(100% - 24px),520px);padding:18px 18px 20px;display:flex;flex-direction:column;gap:11px;
  background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.3);backdrop-filter:blur(14px) saturate(1.3);border:1px solid rgba(255,255,255,.09);border-radius:18px;
  box-shadow:0 18px 60px rgba(0,0,0,.5);transition:opacity .25s}
.card.hide{opacity:0;pointer-events:none}
.card.pos-upper{top:calc(var(--top) + 4%)}
.card.pos-center{top:50%;translate:-50% -50%}
.card.pos-bottom{bottom:14px;overflow-y:auto}
.card.pos-fill{top:calc(var(--top) + 4px);bottom:12px;overflow-y:auto;width:min(calc(100% - 24px),560px)}
.card.buzz{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
.card > *{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.card > *:nth-child(2){animation-delay:.05s}.card > *:nth-child(3){animation-delay:.1s}.card > *:nth-child(4){animation-delay:.15s}
.card > *:nth-child(5){animation-delay:.2s}.card > *:nth-child(6){animation-delay:.25s}.card > *:nth-child(7){animation-delay:.3s}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.eyebrow{margin:0;font-size:.72rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
h2{margin:0;font:600 clamp(1.65rem,6.6vw,2.2rem)/1.04 var(--display);letter-spacing:.005em;text-wrap:balance}
.note{margin:0;color:var(--dim);font-size:.9rem}
.small{margin:0;color:var(--faint);font-size:.78rem;line-height:1.45}

.clockrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.clock{font:italic 800 2rem/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.02em;color:var(--cyan);min-width:3ch;text-align:right;transition:color .3s}
.tbar{height:4px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
.tbar b{display:block;height:100%;background:var(--cyan);transform-origin:0 50%;transition:background .3s}
.warn .clock{color:var(--gold)} .warn .tbar b{background:var(--gold)}
.crit .clock{color:var(--red);animation:tick .5s ease-in-out infinite} .crit .tbar b{background:var(--red)}
@keyframes tick{50%{transform:scale(1.14)}}
form{display:flex;gap:10px;align-items:stretch;margin-top:2px}
.field{flex:1;min-width:0}
input[type=text]{width:100%;font:500 1.15rem var(--body);color:var(--text);background:rgba(255,255,255,.06);border:0;border-bottom:2px solid var(--edge);border-radius:8px 8px 0 0;padding:12px 13px;transition:border-color .2s,background .2s}
input[type=text]:focus{outline:none;border-color:var(--cyan);background:rgba(123,211,255,.09)}
input::placeholder{color:var(--faint)}
.field.nope input{animation:nope .35s;border-color:var(--red)}
@keyframes nope{20%{translate:-6px 0}40%{translate:6px 0}60%{translate:-4px 0}80%{translate:4px 0}}
.go{font:italic 800 1.2rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;padding:0 22px;background:var(--cyan);color:#041018;border-radius:8px;transition:transform .15s,box-shadow .2s}
.go:hover{box-shadow:0 0 22px rgba(123,211,255,.5)} .go:active{transform:scale(.96)}
.go.wide{padding:12px 18px;font-size:1.1rem}
.go.ghost{background:transparent;color:var(--text);box-shadow:inset 0 0 0 2px var(--edge)}
.go.ghost:hover{box-shadow:inset 0 0 0 2px var(--dim)}
.under{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:24px}
.fb{margin:0;font-weight:600;color:var(--dim);min-height:1.5em}
.fb.bad{color:var(--red)}
.link{color:var(--dim);font-size:.9rem;font-weight:500;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--faint)}
.link:hover{color:var(--text)}

.who{font:italic 800 clamp(2rem,9vw,3rem)/.92 var(--display);text-transform:uppercase;letter-spacing:.005em;margin:0;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;gap:9px;font:italic 700 1rem/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--tc,var(--dim));align-self:flex-start}
.badge svg{display:block}
.rare{margin:0}
.rare b{color:var(--tc,var(--text));font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

.sheet{position:absolute;z-index:6;left:50%;translate:-50% 0;top:calc(var(--top) + 4px);bottom:12px;width:min(calc(100% - 24px),520px);display:flex;flex-direction:column;
  background:rgba(6,11,17,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.6);animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 12px 10px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.x{width:36px;height:36px;border-radius:50%;font:600 1.5rem/1 var(--display);color:var(--dim)}
.x:hover{color:var(--text);background:rgba(255,255,255,.08)}
.all{list-style:none;margin:0;padding:0;font-size:.93rem}
.all li{display:grid;grid-template-columns:8px minmax(0,1fr) auto;gap:10px;align-items:center;padding:5px 6px;border-radius:5px}
.all li i{width:8px;height:8px;border-radius:50%;background:var(--tc)}
.all li span:last-child{color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.85rem}
.all li.me{background:rgba(123,211,255,.14);font-weight:600}

.final{font:italic 800 clamp(3.8rem,19vw,6rem)/.82 var(--display);font-variant-numeric:tabular-nums;margin:0;display:flex;align-items:baseline;gap:8px}
.final .u{font-size:.24em;color:var(--dim);font-weight:700;letter-spacing:.06em}
.bars{list-style:none;margin:2px 0;padding:0;display:flex;flex-direction:column;gap:9px}
.bars li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline}
.bars .lab{font-size:.78rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .ans{font-weight:600;font-size:.95rem;overflow-wrap:anywhere}
.bars .ft{font:italic 700 1.15rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--tc);grid-row:1/3;grid-column:2;align-self:center}
.bars .track{grid-column:1/3;height:4px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.bars .track b{display:block;height:100%;border-radius:2px;background:var(--tc);width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0;padding:12px 0;border-block:1px solid rgba(255,255,255,.09)}
.stats div{min-width:0}
.stats dt{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.stats dd{margin:0;font:italic 700 1.5rem/1.1 var(--display);font-variant-numeric:tabular-nums}

.snd{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--dim);flex:none}
.snd:hover{color:var(--text);background:rgba(255,255,255,.08)}
.snd svg{display:block}
.right{display:flex;align-items:center;gap:8px}
.tcbox{margin:0;padding:7px 11px;border-radius:10px;background:rgba(255,200,87,.1);border:1px solid rgba(255,200,87,.35);font-size:.9rem;display:flex;gap:10px;align-items:baseline}
.tcbox b{font:italic 800 .95rem/1 var(--display);letter-spacing:.12em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.all li em{font-style:normal;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);margin-left:6px;white-space:nowrap}
.sheetbody{overflow-y:auto;flex:1;padding:10px 14px 16px;display:flex;flex-direction:column;gap:12px}
.sheetbody .all{padding:0;overflow:visible}
.packs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.packs button{width:100%;text-align:left;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;transition:background .2s,border-color .2s}
.packs button:hover{background:rgba(123,211,255,.1);border-color:rgba(123,211,255,.4)}
.packs .pn{font:italic 800 1.35rem/1 var(--display);letter-spacing:.04em;text-transform:uppercase}
.packs .pc{color:var(--dim);font-size:.8rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.packs .pb{grid-column:1/3;color:var(--dim);font-size:.88rem}
.credits{margin:0;color:var(--dim);font-size:.85rem;line-height:1.5}
.finrow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:6px 18px}
.finrow h2{font-size:clamp(1.3rem,5.4vw,1.7rem);padding-bottom:4px}
.card .final{font-size:clamp(3rem,14vw,4.2rem)}
.under .link{white-space:nowrap}

.right{gap:4px}
.tot{margin-left:6px}
.links{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:flex-end}
.chips{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
.chips b{font:italic 700 .9rem/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.chips span{font:italic 700 .95rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:6px;background:rgba(255,200,87,.14);border:1px solid rgba(255,200,87,.4);color:var(--gold)}
.post{margin:0}
.post input{font-size:1rem;padding:10px 12px}
.sheetbody section{display:flex;flex-direction:column;gap:8px}
.stats.wrap{grid-template-columns:repeat(3,1fr);row-gap:12px}
.sheetbody .stats{padding:10px 0;border-block:0;border-top:1px solid rgba(255,255,255,.09)}
.lb{list-style:none;margin:0;padding:0;font-size:.95rem}
.lb li{display:grid;grid-template-columns:2ch minmax(0,1fr) auto auto;gap:10px;align-items:baseline;padding:6px 6px;border-top:1px solid rgba(255,255,255,.07);border-radius:4px}
.lb .rk{color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.lb .nm{font-weight:600;overflow-wrap:anywhere}
.lb .gl{color:var(--dim);font-size:.82rem;white-space:nowrap}
.lb .ft{font:italic 700 1.1rem/1 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.lb li.me{background:rgba(123,211,255,.14)}
.cal{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal li{aspect-ratio:1/0.82;border-radius:6px;background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:.7rem;color:var(--faint);min-width:0}
.cal li.h{aspect-ratio:auto;background:none;font-weight:600;color:var(--dim);padding-bottom:2px}
.cal li b{font-weight:500}
.cal li span{font:italic 700 .82rem/1 var(--display);font-variant-numeric:tabular-nums;color:var(--tc)}
.cal li.on{background:rgba(255,255,255,.08);color:var(--dim);box-shadow:inset 0 -3px 0 var(--tc)}
.cal li.now{outline:1.5px solid var(--cyan);outline-offset:-1.5px;color:var(--text)}
.cal li.later{opacity:.35}
.achs{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.achs li{padding:9px 11px;border-radius:10px;border:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:2px;color:var(--faint)}
.achs li b{font:italic 700 1.05rem/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.achs li span{font-size:.82rem}
.achs li.got{border-color:rgba(255,200,87,.45);background:rgba(255,200,87,.08);color:var(--dim)}
.achs li.got b{color:var(--gold)}
.shot{display:block;width:100%;height:auto;border-radius:10px;border:1px solid rgba(255,255,255,.1)}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.05)}
.tabs button{padding:9px 8px;border-radius:9px;font:italic 800 1.1rem/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);transition:background .2s,color .2s}
.tabs button[aria-selected="true"]{background:var(--cyan);color:#041018}
.teams{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px}
.teams button{width:100%;text-align:left;padding:10px 7px 10px 11px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-left:4px solid var(--tc);display:flex;align-items:baseline;gap:6px;min-width:0;transition:background .2s,border-color .2s}
.teams button:hover{background:rgba(123,211,255,.1);border-color:rgba(123,211,255,.4);border-left-color:var(--tc)}
.teams b{font:italic 800 1.3rem/1 var(--display);letter-spacing:.04em;flex:none;min-width:1.8em}
.teams span{color:var(--dim);font-size:.8rem;letter-spacing:-.005em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:359px){.teams{grid-template-columns:1fr 1fr}.teams button{flex-direction:column;align-items:flex-start;gap:2px;padding-block:8px}}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.how > li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:start}
.how > li > b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:italic 800 1.15rem/1 var(--display);background:rgba(123,211,255,.14);color:var(--cyan)}
.how h3{margin:3px 0 3px;font:600 1.3rem/1.1 var(--display);letter-spacing:.01em}
.how p{margin:0;color:var(--dim);font-size:.9rem}
.how .bars{margin:10px 0 0}
.how .bars .track b{transition:none}
.vs{margin:0;padding:7px 11px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-weight:600;font-size:.95rem}
.vs.w{background:rgba(255,200,87,.1);border-color:rgba(255,200,87,.4);color:var(--gold)}
.sheetbody .post{display:flex;gap:8px}

<script>
/* ================= data ================= */
const DATA=JSON.parse(document.getElementById("data").textContent);
const NAMES=DATA.names.split("|"), PROMPTS=DATA.prompts;
const TEAMS=DATA.teams||[], TEAM={}; TEAMS.forEach(t=>TEAM["t-"+t[0]]=t);        // every current team has its own pack, "t-TOR" and so on
const GOAL_LINE=189, N_PROMPTS=7, LIMIT=30000;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString("en-CA");
const season=Y=>`${Y}–${String((Y+1)%100).padStart(2,"0")}`;
const REDUCED=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ================= scoring ================= */
function setOf(pi){
  const p=PROMPTS[pi]; if(p._s) return p._s;
  const n=p.a.length/p.k, ans=[];
  for(let i=0;i<n;i++){ const o=i*p.k; ans.push({bi:i,ni:p.a[o],name:NAMES[p.a[o]],vals:p.a.slice(o+1,o+p.k),tc:!!(p.c&&p.c.includes(i)),said:0}); }
  const set=p._s={p,ans,n,total:0}; rankSet(set,null); return set;
}
/* Rank a list from most to least obvious. With no player data this is the formula's order (the order the list ships in).
   As real guesses come in, the order leans toward what players actually say: half weight at 40 guesses on a prompt. */
function rankSet(set,counts){
  const n=set.n, K=40; let N=0; set.ans.forEach(a=>{ a.said=(counts&&counts[a.name])||0; N+=a.said; }); set.total=N;
  const lam=N/(N+K), cr=new Map(set.ans.slice().sort((x,y)=>y.said-x.said||x.bi-y.bi).map((a,i)=>[a,i]));
  const key=a=>(1-lam)*a.bi+lam*cr.get(a);
  set.sorted=set.ans.slice().sort((x,y)=>key(x)-key(y)||x.bi-y.bi);
  set.sorted.forEach((a,r)=>{ a.rank=r; a.pct=n>1?r/(n-1):0; a.feet=Math.round(11+189*a.pct); });
}
function tierOf(feet,pct){
  if(feet<=0) return {t:0,name:"Turnover"};
  if(pct>=0.99) return {t:6,name:"Bar down"};
  if(feet>=GOAL_LINE) return {t:5,name:"Goal"};
  if(feet>=165) return {t:4,name:"In the slot"};
  if(feet>125) return {t:3,name:"Zone entry"};
  if(feet>=75) return {t:2,name:"Neutral zone"};
  return {t:1,name:"Own zone"};
}
function detail(p,a){
  const t=p.t, v=a.vals, ht=h=>`${Math.floor(h/12)}'${h%12}"`;
  switch(t[0]){
    case "c": return `${fmt(v[0])} ${t[1]}`;
    case "s": return `${fmt(v[0])} ${t[1]} in ${season(v[1])}`+(v[2]>1?` · ${v[2]} seasons like it`:"");
    case "sp": return `${v[0]} ${t[1]} in the ${v[1]} playoffs`+(v[2]>1?` · ${v[2]} runs like it`:"");
    case "r": return `${v[0]} GP · ${v[1]} ${v[2]?"wins":"pts"}`;
    case "rp": return `${v[0]} playoff GP · ${v[1]} ${v[2]?"wins":"pts"}`;
    case "y": return `NHL career ${v[0]}–${v[1]}`;
    case "d": return `No. ${v[0]} overall`;
    case "dy": return `No. ${v[0]} overall, ${v[1]}`;
    case "l": return v[0]>1?`${v[0]} times, last in ${season(v[1])}`:`In ${season(v[1])}`;
    case "h": return ht(v[0]);
    case "a": return `Age ${v[0]} in ${season(v[1])}`;
    case "pg": return `${(v[0]/100).toFixed(2)} points per game`;
    case "x": return t[1][v[0]]||"";
  }
  return "";
}
function rating(total){
  if(total>=1200) return "Coast to coast";
  if(total>=950) return "End-to-end rush";
  if(total>=650) return "Clean zone entry";
  if(total>=350) return "Dump and chase";
  return "Pinned in your own end";
}

function readChallenge(){ let q=""; try{ q=new URLSearchParams(location.search).get("c")||""; }catch(e){} if(!q) return null;

let lastClock="", lastSec=-1;
function tickClock(){

  const sec=Math.ceil(rem/1000); if(sec!==lastSec){ if(lastSec!==-1&&sec<=5) SFX.tick(); lastSec=sec; }
  $("tbar").style.transform=`scaleX(${rem/limitOf()})`;
  const cls=rem<5000?"crit":rem<10000?"warn":""; const row=$("timer"); if(row.dataset.s!==cls){ row.dataset.s=cls; row.className="timer "+cls; }
}

/* ---------- achievements and records (kept on this device) ---------- */
const ACH=[["goal","Lamp lighter","Score your first goal."],["bar","Bar down","Find the single rarest answer on a list."],["hat","Hat trick","Three goals in one game."],
  ["c2c","Coast to coast","1,200 feet or more in one game."],["clean","Full shift","Answer all seven prompts in a game."],["buzz","Buzzer beater","Lock in an answer with under two seconds left."],
  ["tc","Too clever","Get caught using a go-to deep cut."],["rook","Called up","900 feet or more in Rookie mode."],["week","Iron man","Play the daily seven days in a row."],
  ["packs","Pack rat","Finish a game in every themed pack."],["ten","Regular","Finish ten games."],["cent","Century","Score 100 goals in total."],
  ["duel","Grudge match","Beat a friend's challenge."],["home","Home ice","Finish a game in a team pack."]];
const dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
function finish(){ if(state.counted) return; state.counted=true;
  const R=state.results, t=total(), goals=R.filter(r=>r.feet>=GOAL_LINE).length, bars=R.filter(r=>r.i>=0&&r.pct>=.99).length, key=state.mode==="pack"?state.pack:state.mode;
  for(const k of ["bestBy","days","ach","packs"]) if(!stats[k]||typeof stats[k]!=="object") stats[k]={};
  stats.played++; stats.goals+=goals; stats.bars=(stats.bars||0)+bars; stats.best=Math.max(stats.best,t); stats.bestBy[key]=Math.max(stats.bestBy[key]||0,t);
  if(state.mode==="pack") stats.packs[state.pack]=1;
  if(state.mode==="daily"){ const d=new Date(); d.setDate(d.getDate()-1);
    if(stats.lastDaily!==state.key){ stats.streak=stats.lastDaily===dayKey(d)?stats.streak+1:1; stats.lastDaily=state.key; }
    stats.maxStreak=Math.max(stats.maxStreak||0,stats.streak); stats.days[state.key]=t;
    const keep=Object.keys(stats.days).sort().slice(-120), nd={}; keep.forEach(k=>nd[k]=stats.days[k]); stats.days=nd; }
  const got=[], unlock=(id,ok)=>{ if(ok&&!stats.ach[id]){ stats.ach[id]=today(); got.push(id); } };
  unlock("goal",goals>=1); unlock("bar",bars>=1); unlock("hat",goals>=3); unlock("c2c",t>=1200); unlock("clean",R.every(r=>r.i>=0));
  unlock("buzz",R.some(r=>r.i>=0&&r.left<2000)); unlock("tc",R.some((r,k)=>r.i>=0&&setOf(state.picks[k]).ans[r.i].tc)); unlock("rook",state.pack==="rk"&&t>=900);
  unlock("week",stats.streak>=7); unlock("packs",PACKS.every(p=>stats.packs[p[0]])); unlock("ten",stats.played>=10); unlock("cent",stats.goals>=100);
  unlock("duel",!!state.ch&&t>state.ch.feet); unlock("home",!!TEAM[state.pack]);
  state.newAch=got; store.set(K_STATS,stats); }
const feetTier=f=>f>=1200?6:f>=950?4:f>=650?3:f>=350?2:1;
function calendarHtml(){ const now=new Date(), start=new Date(now.getFullYear(),now.getMonth(),now.getDate()-now.getDay()-28), tk=today(); let h="";
  for(let i=0;i<35;i++){ const d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i), k=dayKey(d), f=stats.days&&stats.days[k];
    h+=`<li class="${f!=null?"t"+feetTier(f)+" on":""}${k===tk?" now":""}${k>tk?" later":""}" title="${d.toLocaleDateString("en-CA",{month:"short",day:"numeric"})}${f!=null?": "+fmt(f)+" ft":""}"><b>${d.getDate()}</b>${f!=null?`<span>${fmt(f)}</span>`:""}</li>`; }
  return `<ol class="cal" aria-label="Daily results for the last five weeks"><li class="h">S</li><li class="h">M</li><li class="h">T</li><li class="h">W</li><li class="h">T</li><li class="h">F</li><li class="h">S</li>${h}</ol>`; }

function copyText(txt,done,where){ const fb=$(where||"fb");

  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(()=>{ if(fb) fb.textContent=done; },fallback); else fallback(); }

    catch(e){ if(e&&e.name==="AbortError") return; }

}
function breakdownHtml(){
  const bars=state.results.map((r,k)=>{ const set=setOf(state.picks[k]), a=r.i>=0?set.ans[r.i]:null, ti=tierOf(r.feet,r.pct||0);
    return `<li class="t${ti.t}"><span class="lab">${esc(set.p.s)}</span><span class="ft">${r.feet} ft</span><span class="ans">${a?esc(a.name):(r.how==="pass"?"Passed":"Time's up")}</span><span class="track"><b style="width:${r.feet/2}%"></b></span></li>`; }).join("");
  return `<ol class="bars">${bars}</ol>`; }
async function sendChallenge(name){ const url=challengeUrl(name), text=`I went ${fmt(total())} ft on ${NAME}. Same seven prompts for you. Beat it:`;
  try{ if(navigator.share){ await navigator.share({text,url}); return; } }catch(e){ if(e&&e.name==="AbortError") return; }
  copyText(text+" "+url,"Challenge link copied. Paste it to a friend.","shfb"); }
function openShare(){
  openSheet("Share",`<section><p class="eyebrow">Challenge a friend</p><p class="credits">Send a link to the same seven prompts, with your ${fmt(total())} ft as the score to beat.</p>
      <form class="post" id="chform" autocomplete="off"><label class="sr" for="chname">Your name, optional</label><input id="chname" type="text" maxlength="16" placeholder="Your name (optional)" value="${esc(store.get("c2c-name")||"")}" autocapitalize="words" spellcheck="false"><button class="go" type="submit">Send</button></form></section>
    <section><p class="eyebrow">Show your result</p><div class="row"><button class="go wide ghost" id="shpic" type="button">Share picture</button><button class="go wide ghost" id="shtxt" type="button">Copy text</button></div></section>
    <p class="fb" id="shfb" role="status" aria-live="polite"></p>`,"share");
  $("chform").addEventListener("submit",e=>{ e.preventDefault(); const name=$("chname").value.trim().replace(/\s+/g," "), fb=$("shfb");
    if(name&&(!NAME_OK.test(name)||RUDE.test(name))){ fb.className="fb bad"; fb.textContent="Use up to 16 letters, numbers or spaces."; return; }
    fb.className="fb"; fb.textContent=""; if(name) store.set("c2c-name",name); sendChallenge(name); });
  $("shpic").addEventListener("click",()=>{ $("shfb").className="fb"; shareImage(); });
  $("shtxt").addEventListener("click",()=>{ $("shfb").className="fb"; copyText(shareText(),"Copied.","shfb"); });
}
let ticker=null;
function viewDone(focus){
  const t=total(), goals=state.results.filter(r=>r.feet>=GOAL_LINE).length, daily=state.mode==="daily", board=daily&&NET.on();
  const got=(state.newAch||[]).map(id=>ACH.find(a=>a[0]===id)).filter(Boolean), ch=state.ch;
  show(`<p class="eyebrow">${modeLabel()} · Final score</p>
    <div class="finrow"><p class="final"><span id="fin">0</span><span class="u">FT</span></p><h2>${rating(t)}. ${goals} ${goals===1?"goal":"goals"}.</h2></div>
    ${ch?`<p class="vs${t>ch.feet?" w":""}">${t>ch.feet?`You beat ${esc(ch.name||"your friend")} by ${fmt(t-ch.feet)} ft.`:t<ch.feet?`${esc(rival())} still has you by ${fmt(ch.feet-t)} ft.`:`Dead even with ${esc(ch.name||"your friend")} at ${fmt(t)} ft.`}</p>`:""}
    ${got.length?`<p class="chips"><b>Unlocked</b>${got.map(a=>`<span title="${esc(a[2])}">${a[1]}</span>`).join("")}</p>`:""}
    ${board&&!state.posted?`<form class="post" id="post" autocomplete="off"><label class="sr" for="lbname">Name for the leaderboard</label><input id="lbname" type="text" maxlength="16" placeholder="Name for the leaderboard" value="${esc(store.get("c2c-name")||"")}" autocapitalize="words" spellcheck="false"><button class="go" type="submit">Post</button></form>`:""}
    <div class="row"><button class="go wide" id="again" type="button">${daily?"Play a free skate":"New game"}</button><button class="go wide ghost" id="share" type="button">Share</button></div>
    <div class="under"><p class="fb" id="fb" role="status" aria-live="polite">${daily?'Next daily in <span id="count"></span>.':""}</p><span class="links"><button class="link" id="brk" type="button">Breakdown</button><button class="link" id="recs" type="button">${board?"Leaderboard":"Records"}</button></span></div>
    <textarea class="sr" id="sharebox" readonly tabindex="-1" aria-hidden="true"></textarea>`);
  puckReset(false);
  recap={t0:performance.now()+350,items:recapItems()};
  if(got.length&&!state.achShown){ state.achShown=true; save(); setTimeout(()=>SFX.ping(),900); }
  const fin=$("fin"); if(REDUCED){ fin.textContent=fmt(t); } else { const t0=performance.now(); const step=n=>{ const p=Math.min(1,(n-t0)/1400); fin.textContent=fmt(Math.round(t*ease(p))); if(p<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }
  $("brk").addEventListener("click",()=>openSheet("Breakdown",breakdownHtml(),"brk"));
  $("recs").addEventListener("click",()=>openRecords("recs"));
  $("share").addEventListener("click",openShare);
  const post=$("post"); if(post) post.addEventListener("submit",e=>{ e.preventDefault(); const name=$("lbname").value.trim().replace(/\s+/g," "), fb=$("fb");
    if(!NAME_OK.test(name)||RUDE.test(name)){ fb.className="fb bad"; fb.textContent="Use 1 to 16 letters, numbers or spaces."; return; }
    store.set("c2c-name",name); fb.className="fb"; fb.textContent="Posting…";
    NET.submit(state.key,name,t,goals).then(()=>{ state.posted=true; save(); post.remove(); resize(); fb.textContent="Posted."; openRecords("recs"); }).catch(()=>{ fb.className="fb bad"; fb.textContent="Couldn't post just now. Try again in a minute."; }); });
  $("again").addEventListener("click",()=>{ SFX.unlock(); state=state.mode==="pack"?fresh("pack",state.pack):fresh("free"); begin(); });
  clearInterval(ticker);
  if(daily){ const tick=()=>{ const el=$("count"); if(!el) return clearInterval(ticker); const n=new Date(), m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1); let s=Math.max(0,Math.floor((m-n)/1000)); const h=Math.floor(s/3600); s-=h*3600; const mi=Math.floor(s/60); s-=mi*60; el.textContent=`${h}h ${String(mi).padStart(2,"0")}m ${String(s).padStart(2,"0")}s`; }; tick(); ticker=setInterval(tick,1000); }
  if(focus) $("again").focus({preventScroll:true});
}
let lastView="";
function render(focus){ $("sheet").hidden=true; loadCrowd(); drawHud(); const v=state.view; if(v==="intro") viewIntro(focus); else if(v==="ask") viewAsk(focus); else if(v==="result") viewResult(false,focus); else viewDone(focus); drawHud();
  if((v==="done")!==(lastView==="done")||v==="done") resize(); lastView=state.view; }
function switchMode(mode){ if(mode==="pack"){ if(state.mode!=="pack"){ const s=loadMode("pack"); if(s){ state=s; save(); render(false); return; } } return openPacks(); }
  if(state.mode===mode) return; state=loadMode(mode); save(); render(false); }

/* ================= boot ================= */
for(const m of ["daily","free","pack"]) $("m-"+m).addEventListener("click",()=>switchMode(m));
$("snd").addEventListener("click",()=>{ SFX.toggle(); drawSnd(); if(SFX.on) SFX.tap(); });
$("rec").addEventListener("click",()=>openRecords("rec"));
$("sheetx").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeSheet(); });
{ const m=store.get(K_MODE); state=(m==="pack"&&loadMode("pack"))||loadMode(m==="free"?"free":"daily"); }
const linked=readChallenge(); if(linked&&!linked.bad) takeChallenge(linked);
drawSnd(); resize(); render(false);
if(linked&&linked.bad){ const fb=document.createElement("p"); fb.className="small"; fb.textContent="That challenge link is out of date, so here's today's game instead."; card.appendChild(fb); }
if(!store.get(K_SEEN)){ if(stats.played) store.set(K_SEEN,1); else if(state.view==="intro") openHow("start"); }
try{ document.fonts.load('italic 700 15px "Barlow Condensed"'); }catch(e){}
window.addEventListener("resize",resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe(app);
requestAnimationFrame(loop);
</script>

</body>
</html>
